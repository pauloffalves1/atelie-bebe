<div class="admin-shell">
  <aside class="admin-sidebar p-3 d-flex flex-column">
    <a routerLink="/admin/dashboard" class="d-flex align-items-center gap-2 text-decoration-none text-white mb-4 px-2 pt-2">
      <span class="fw-script fs-4 text-blush brand-embroidered">Ateliê Layette Baby</span>
    </a>

    <nav class="nav flex-column gap-1 flex-grow-1">
      <a class="nav-link d-flex align-items-center gap-2" routerLink="/admin/dashboard" routerLinkActive="active">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a class="nav-link d-flex align-items-center gap-2" routerLink="/admin/produtos" routerLinkActive="active">
        <i class="bi bi-box-seam"></i> Produtos
      </a>
      <a class="nav-link d-flex align-items-center gap-2" routerLink="/admin/encomendas" routerLinkActive="active">
        <i class="bi bi-receipt"></i> Encomendas
      </a>
      <a class="nav-link d-flex align-items-center gap-2" routerLink="/admin/clientes" routerLinkActive="active">
        <i class="bi bi-people"></i> Clientes
      </a>
      <a class="nav-link d-flex align-items-center gap-2" routerLink="/admin/mensagens" routerLinkActive="active">
        <i class="bi bi-chat-dots"></i> Mensagens
      </a>
    </nav>

    <div class="border-top border-secondary-subtle pt-3 mt-3">
      <p class="small text-white-50 mb-2 px-2">
        <i class="bi bi-person-circle me-1"></i>{{ auth.currentUser()?.name }}
      </p>
      <button class="btn btn-sm btn-outline-light w-100 rounded-pill" (click)="logout()">
        <i class="bi bi-box-arrow-left me-1"></i>Sair
      </button>
    </div>
  </aside>

  <div class="admin-content">
    <router-outlet />
  </div>
</div>
