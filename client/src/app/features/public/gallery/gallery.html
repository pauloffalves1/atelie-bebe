<section class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="section-title text-center">Galeria do Ateliê</h1>
      <p class="text-secondary mt-3">Um pouquinho dos trabalhos feitos com carinho para as famílias que confiam no Ateliê Layette Baby.</p>
    </div>

    <div class="row g-3">
      @for (image of images; track image) {
        <div class="col-6 col-md-4 col-lg-3">
          <div class="rounded-4 overflow-hidden shadow-sm" style="aspect-ratio: 4/5;">
            <img [src]="image" alt="Trabalho do ateliê" class="w-100 h-100 object-fit-cover" loading="lazy">
          </div>
        </div>
      }
    </div>
  </div>
</section>
