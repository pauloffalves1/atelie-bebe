<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="stat-card">
          <div class="text-center mb-4">
            <span class="fw-script fs-2 text-blush">Ateliê Bebê</span>
            <h4 class="mt-2">Criar minha conta</h4>
          </div>

          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Nome completo</label>
              <input type="text" class="form-control" formControlName="name">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">E-mail</label>
              <input type="email" class="form-control" formControlName="email">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Telefone (opcional)</label>
              <input type="text" class="form-control" formControlName="phone">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Senha</label>
              <input type="password" class="form-control" formControlName="password">
              <span class="form-text">Mínimo de 6 caracteres.</span>
            </div>

            @if (errorMessage()) {
              <div class="alert alert-danger small rounded-4">{{ errorMessage() }}</div>
            }

            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill mt-3" [disabled]="submitting()">
              @if (submitting()) {
                <span class="spinner-border spinner-border-sm me-2"></span>
              }
              Criar conta
            </button>
          </form>

          <p class="text-center small text-secondary mt-4 mb-0">
            Já tem conta? <a routerLink="/entrar" class="text-blush fw-semibold">Entrar</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
