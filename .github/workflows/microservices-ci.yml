name: microservices-ci

# Only microservices/ has a real test suite today (dotnet test + Playwright e2e); the old
# server/client/ monolith is kept as a rollback and isn't wired into CI. See
# microservices/README.md's "Estratégia de testes" section for what each job below covers.
on:
  push:
    branches: [master]
    paths: ["microservices/**"]
  pull_request:
    paths: ["microservices/**"]

defaults:
  run:
    working-directory: microservices

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # One command for all 5 *.Core.Tests projects (109 tests) via the solution added for this.
      - run: dotnet test AtelieBebe.Microservices.slnx --nologo

  e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      # RS256 key pair Identity/Gateway/Catalog/Orders/Backoffice share (never committed) — see
      # README's "Autenticação e Autorização". A fresh pair is fine for CI: nothing here persists
      # past the job.
      - run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt-private.pem 2048
          openssl rsa -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem

      # Dummy values are enough for these 3 specs: none of them log in, pay, or send
      # WhatsApp/e-mail/New Relic traffic. Real deploys fill this from repo/environment secrets.
      - run: |
          cat > .env <<EOF
          RABBITMQ_USER=ci
          RABBITMQ_PASSWORD=ci_password_123
          MSSQL_SA_PASSWORD=CiPassword_123!
          ADMIN_SEED_EMAIL=admin@ateliebebe.com.br
          ADMIN_SEED_PASSWORD=admin123
          PAGBANK_TOKEN=
          PAGBANK_SANDBOX=true
          PUBLIC_URL=http://localhost:5100
          WHATSAPP_ACCESS_TOKEN=
          WHATSAPP_PHONE_NUMBER_ID=
          ADMIN_NOTIFICATION_EMAIL=
          ADMIN_NOTIFICATION_PHONE=
          RESEND_API_KEY=
          RESEND_FROM_EMAIL=
          NEW_RELIC_LICENSE_KEY=
          EOF

      - run: docker compose build
      - run: docker compose up -d

      - name: Wait for the Gateway to serve seeded products
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5100/api/products || true)
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: microservices/frontend/shell/package-lock.json

      - working-directory: microservices/frontend/shell
        run: npm ci

      - working-directory: microservices/frontend/shell
        run: npx playwright install --with-deps chromium

      # Serialized on purpose (playwright.config.ts's workers: 1) — the 3 dev servers behind these
      # specs compile chunks on demand, and parallel workers made the first navigation flaky.
      - working-directory: microservices/frontend/shell
        run: npm run test:e2e

      - if: always()
        run: docker compose down -v

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: microservices/frontend/shell/playwright-report/
          retention-days: 7
