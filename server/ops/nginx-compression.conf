# HTTP response compression — add inside the `http { ... }` block in /etc/nginx/nginx.conf, or
# inside the `server { listen 443 ssl; ... }` block in /etc/nginx/sites-enabled/atelie-bebe (see
# README.md, "Compressão HTTP (gzip/brotli)"). Not applied automatically — same as the other
# reference snippets in this folder, the VPS's Nginx config isn't tracked in this repo.

# gzip ships with Nginx by default — no extra module needed.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml;

# Brotli usually compresses better than gzip, but needs the `ngx_brotli` module, which isn't
# built into stock Nginx — only add this block after installing it (see below); gzip alone
# already covers most of the benefit and needs no extra setup.
#
# Install on Ubuntu (Nginx from the default apt repo doesn't support dynamic module loading for
# brotli the same way as a source build; the simplest path is the PPA that ships a prebuilt
# module):
#   sudo add-apt-repository ppa:ondrej/nginx-mainline -y   # or use the OS's own Nginx if it already bundles brotli
#   sudo apt update && sudo apt install nginx-module-brotli
#   Add `load_module modules/ngx_http_brotli_filter_module.so;` and
#   `load_module modules/ngx_http_brotli_static_module.so;` at the very top of nginx.conf
#   (outside any block), then uncomment the block below.
#
# brotli on;
# brotli_comp_level 5;
# brotli_types
#     text/plain
#     text/css
#     application/json
#     application/javascript
#     application/manifest+json
#     image/svg+xml;
