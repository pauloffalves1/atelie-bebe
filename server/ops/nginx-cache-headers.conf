# Cache headers for static assets — add these `location` blocks inside the existing
# `server { listen 443 ssl; ... }` block in /etc/nginx/sites-enabled/atelie-bebe (see
# README.md, "Cache de imagens e assets estáticos"). Not applied automatically — Nginx config
# on the VPS isn't managed by this repo, this file is just the reference snippet to paste in.
#
# IMPORTANT: the /api/uploads/ block below needs the SAME proxy_pass and proxy_set_header
# lines your existing `location /api/` block already uses (X-Forwarded-For etc.) — copy
# those over instead of the placeholder below, since a more specific `location` match
# doesn't inherit anything from a less specific one. Run `sudo nginx -T` to see the current
# `/api/` block and copy its proxy_set_header lines here.

# Uploaded images (products/gallery/site): each upload gets a new GUID filename, so a given
# URL's content never changes — safe to cache "forever" (immutable skips revalidation entirely).
location /api/uploads/ {
    proxy_pass http://127.0.0.1:5120;   # match your existing /api/ proxy_pass target exactly
    # proxy_set_header ...              # copy every proxy_set_header line from your /api/ block here
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Angular's own build output: content-hashed filenames (chunk-XXXX.js, styles-XXXX.css) — same
# reasoning, a given filename's content never changes across deploys (a new deploy emits new
# hashed filenames instead of overwriting old ones).
location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# index.html must NEVER be cached — it's the entry point that references the current build's
# hashed filenames; caching it would keep serving old bundle references after a deploy.
location = /index.html {
    add_header Cache-Control "no-cache";
}
